
name: HIoT-Guard CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "module-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  automated-tests:
    name: Run Python Tests
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-module2.txt

      - name: Run Module 1 and Module 2 tests
        run: |
          python -m unittest test_live test_module2 -v

  package-module2:
    name: Prepare Module 2 Delivery
    needs: automated-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Create release package
        shell: pwsh
        run: |
          Compress-Archive -Path module2, MODULE2.md, requirements-module2.txt, requirements.txt, launch_module2.py, run-module2.cmd -DestinationPath module2-release.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: hiot-guard-module2
          path: module2-release.zip
